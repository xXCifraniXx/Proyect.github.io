# CALIDAD
# Revisa la versión React (app/) en cada PR hacia develop o main y en cada
# push a develop. También la usa publicar.yml antes de publicar, para que a
# main nunca llegue algo roto (SPEC.md, criterios 4, 6 y 10).
name: Calidad

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

jobs:
  revisar:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Formato
        run: npm run format:check

      - name: Compilar
        run: npm run build

      - name: Peso de la carga inicial
        run: npm run revisar-peso

      # El repo es público: las cuentas van por UID, nunca por correo.
      - name: Sin correos en el repo
        working-directory: .
        run: |
          if git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}' -- . ':!app/package-lock.json'; then
            echo "::error::Hay algo con forma de correo en el repo. Usa el UID de Firebase en su lugar."
            exit 1
          fi
