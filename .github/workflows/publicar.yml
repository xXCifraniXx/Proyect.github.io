# PUBLICAR
# Cada vez que algo llega a main: revisa (calidad.yml), compila el sitio y lo
# publica en Firebase Hosting (https://para-anthuanete.web.app/, plan Spark).
#
# GitHub Pages ya no se publica. El link viejo
# (https://xxcifranixx.github.io/Proyect.github.io/) sigue mostrando la
# redirección que quedó el 20-11-2026 (redireccion-github/index.html) hasta
# que se apague Pages en Settings → Pages (ver README, "Apagar GitHub Pages").
#
# Requiere en GitHub el secreto FIREBASE_SERVICE_ACCOUNT_ANTHUANETE_6D629 (lo
# crea `firebase init hosting:github`; ver README, "Publicación"). Si falta,
# la publicación falla y el sitio sigue como estaba.
# También se puede lanzar a mano desde la pestaña Actions.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Una publicación a la vez; si llegan dos seguidas, la segunda espera.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  calidad:
    uses: ./.github/workflows/calidad.yml

  firebase:
    name: Publicar en Firebase Hosting
    needs: calidad
    runs-on: ubuntu-latest
    environment:
      name: firebase-hosting
      url: https://para-anthuanete.web.app/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # Sube dist/ (ver firebase.json) al canal "live", el que ve Anthuanete.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANTHUANETE_6D629 }}
          projectId: anthuanete-6d629
          channelId: live
