<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Constelación de nosotros</title>
    <meta
      name="description"
      content="Un cielo para los dos: toca para crear estrellas con recuerdos y se conectan en una constelación."
    />
    <meta name="theme-color" content="#120817" />
    <!-- Vista previa del tema café (SPEC 1.6), igual que en index.html. -->
    <script>
      if (new URLSearchParams(location.search).get("tema") === "cafe") {
        document.documentElement.dataset.tema = "cafe";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#140c08");
      }
    </script>
    <link rel="icon" href="/assets/images/icono.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/images/icono-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/images/icono-180.png" />
  </head>
  <body>
    <div id="cielo"></div>
    <script type="module" src="/src/constelacion/main.tsx"></script>
  </body>
</html>
